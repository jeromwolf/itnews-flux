{% extends "base.html" %}

{% block title %}Videos - Tech News Digest{% endblock %}

{% block content %}
<h1 style="margin-bottom: 2rem;">🎬 Videos</h1>

<!-- Controls -->
<div class="card" style="margin-bottom: 2rem;">
    <div class="card-body">
        <div style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 150px; margin-bottom: 0;">
                <label class="form-label">Filter by Status</label>
                <select id="status-filter" class="form-select" onchange="loadVideos()">
                    <option value="">All</option>
                    <option value="pending">Pending</option>
                    <option value="generating">Generating</option>
                    <option value="completed">Completed</option>
                    <option value="failed">Failed</option>
                    <option value="uploaded">Uploaded</option>
                </select>
            </div>
            <div class="form-group" style="flex: 1; min-width: 150px; margin-bottom: 0;">
                <label class="form-label">Limit</label>
                <input type="number" id="limit" class="form-input" value="10" min="1" max="50" onchange="loadVideos()">
            </div>
            <button onclick="loadVideos()" class="btn btn-primary">🔄 Refresh</button>
            <a href="/news" class="btn btn-success">➕ Create New Video</a>
        </div>
    </div>
</div>

<!-- Videos List -->
<div id="videos-list">
    <div class="loading">
        <div class="spinner"></div>
        <p>Loading videos...</p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadVideos(preserveState = false) {
    try {
        const status = document.getElementById('status-filter').value || null;
        const limit = parseInt(document.getElementById('limit').value);

        // Save open details state before reload
        const openDetails = new Set();
        if (preserveState) {
            document.querySelectorAll('details[open]').forEach(detail => {
                if (detail.id) {
                    openDetails.add(detail.id);
                }
            });
        }

        document.getElementById('videos-list').innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading videos...</p>
            </div>
        `;

        const videos = await API.Videos.listVideos(limit, status);

        if (videos.length === 0) {
            document.getElementById('videos-list').innerHTML = `
                <div class="card">
                    <div class="card-body" style="text-align: center; padding: 3rem; color: var(--text-secondary);">
                        <p style="font-size: 3rem; margin-bottom: 1rem;">📹</p>
                        <p style="font-size: 1.2rem;">No videos yet</p>
                        <p style="margin-top: 1rem;">
                            <a href="/news" class="btn btn-primary">Create Your First Video</a>
                        </p>
                    </div>
                </div>
            `;
            stopAutoRefresh(); // No videos, stop refresh
            return;
        }

        const videosHtml = videos.map(video => {
            const statusBadgeClass =
                video.status === 'completed' || video.status === 'uploaded' ? 'badge-success' :
                video.status === 'failed' ? 'badge-failed' :
                'badge-pending';

            return `
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title" style="font-size: 1.1rem;">${video.title}</h3>
                        <span class="badge ${statusBadgeClass}">${video.status}</span>
                    </div>
                    <div class="card-body">
                        <div class="grid grid-2">
                            <!-- Video Info -->
                            <div>
                                <p><strong>ID:</strong> <code>${video.id}</code></p>
                                <p><strong>Created:</strong> ${utils.formatDate(video.created_at)}</p>
                                ${video.duration ? `<p><strong>Duration:</strong> ${utils.formatDuration(video.duration)}</p>` : ''}
                                <p><strong>Cost:</strong> ${utils.formatCost(video.total_cost)}</p>
                                ${video.youtube_url ? `<p><strong>YouTube:</strong> <a href="${video.youtube_url}" target="_blank">Watch →</a></p>` : ''}
                                ${video.error ? `<p style="color: var(--danger-color);"><strong>Error:</strong> ${video.error}</p>` : ''}
                            </div>

                            <!-- Segments -->
                            <div>
                                ${video.segments.length > 0 ? `
                                    <p><strong>Segments (${video.segments.length}):</strong></p>
                                    <ul style="margin-left: 1.5rem; color: var(--text-secondary);">
                                        ${video.segments.map(s => `
                                            <li style="margin-bottom: 0.5rem;">
                                                ${s.title}<br>
                                                <small>${utils.formatDuration(s.duration)} - ${utils.formatCost(s.cost)}</small>
                                            </li>
                                        `).join('')}
                                    </ul>
                                ` : '<p style="color: var(--text-secondary);">No segments yet</p>'}
                            </div>
                        </div>

                        <!-- Progress Bar (for generating status) -->
                        ${video.status === 'generating' || video.status === 'uploading' ? `
                            <div class="progress" style="margin-top: 1rem;">
                                <div class="progress-bar" style="width: ${video.status === 'generating' ? '50%' : '75%'};"></div>
                            </div>
                            <p style="text-align: center; color: var(--text-secondary); margin-top: 0.5rem;">
                                ${video.status === 'generating' ? 'Generating video...' : 'Uploading to YouTube...'}
                            </p>
                        ` : ''}

                        <!-- Thumbnail Preview -->
                        <details style="margin-top: 1.5rem; padding: 1rem; background: #f8fafc; border-radius: 6px;" id="thumbnail-${video.id}">
                            <summary style="cursor: pointer; font-weight: 600; color: var(--primary-color);">
                                🖼️ YouTube Thumbnail
                            </summary>
                            <div style="margin-top: 1rem;">
                                ${video.thumbnail_path ? `
                                    <img
                                        src="/api/videos/${video.id}/thumbnail"
                                        alt="YouTube Thumbnail"
                                        style="width: 100%; max-width: 800px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"
                                    >
                                    <div style="margin-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
                                        <p style="color: var(--text-secondary); font-size: 0.9rem; margin: 0;">
                                            Resolution: 1280x720 • Size: ~250KB
                                        </p>
                                        <a href="/api/videos/${video.id}/thumbnail" download="${video.id}_thumbnail.jpg" class="btn btn-secondary">
                                            📥 Download Thumbnail
                                        </a>
                                    </div>
                                ` : `
                                    <div style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                                        <p style="margin-bottom: 1rem;">No thumbnail available for this video.</p>
                                        <button onclick="generateThumbnail('${video.id}')" class="btn btn-primary">
                                            🎨 Generate Thumbnail
                                        </button>
                                    </div>
                                `}
                            </div>
                        </details>

                        <!-- Video Preview -->
                        ${video.video_path && (video.status === 'completed' || video.status === 'uploaded') ? `
                            <details style="margin-top: 1.5rem; padding: 1rem; background: #f8fafc; border-radius: 6px;" id="preview-${video.id}">
                                <summary style="cursor: pointer; font-weight: 600; color: var(--primary-color);">
                                    🎬 Video Preview
                                </summary>
                                <div style="margin-top: 1rem;">
                                    <video
                                        id="video-player-${video.id}"
                                        controls
                                        style="width: 100%; max-height: 400px; border-radius: 8px; background: #000;"
                                        preload="metadata"
                                    >
                                        <source src="/api/videos/${video.id}/stream" type="video/mp4">
                                        Your browser does not support the video tag.
                                    </video>
                                </div>
                            </details>
                        ` : ''}

                        <!-- YouTube Metadata -->
                        ${video.youtube_metadata ? `
                            <details style="margin-top: 1.5rem; padding: 1rem; background: #f8fafc; border-radius: 6px;" id="metadata-${video.id}">
                                <summary style="cursor: pointer; font-weight: 600; color: var(--primary-color);">
                                    📺 YouTube Metadata
                                </summary>
                                <div style="margin-top: 1rem;" id="metadata-display-${video.id}">
                                    <div style="margin-bottom: 1rem;">
                                        <strong>Title:</strong>
                                        <p style="margin: 0.5rem 0; padding: 0.5rem; background: white; border-radius: 4px; font-family: monospace;" id="title-display-${video.id}">${video.youtube_metadata.title}</p>
                                    </div>
                                    <div style="margin-bottom: 1rem;">
                                        <strong>Description:</strong>
                                        <pre style="margin: 0.5rem 0; padding: 0.5rem; background: white; border-radius: 4px; white-space: pre-wrap; font-size: 0.85rem; max-height: 300px; overflow-y: auto;" id="description-display-${video.id}">${video.youtube_metadata.description}</pre>
                                    </div>
                                    <div style="margin-bottom: 1rem;">
                                        <strong>Tags (${video.youtube_metadata.tags.length}):</strong>
                                        <div style="margin: 0.5rem 0; display: flex; flex-wrap: wrap; gap: 0.5rem;" id="tags-display-${video.id}">
                                            ${video.youtube_metadata.tags.slice(0, 20).map(tag => `<span style="padding: 0.25rem 0.5rem; background: var(--primary-color); color: white; border-radius: 4px; font-size: 0.85rem;">${tag}</span>`).join('')}
                                            ${video.youtube_metadata.tags.length > 20 ? `<span style="padding: 0.25rem 0.5rem; background: #6b7280; color: white; border-radius: 4px; font-size: 0.85rem;">+${video.youtube_metadata.tags.length - 20} more</span>` : ''}
                                        </div>
                                    </div>
                                    <div>
                                        <strong>Settings:</strong>
                                        <p style="margin: 0.5rem 0; color: var(--text-secondary);">
                                            Category: Science & Technology (28) • Privacy: ${video.youtube_metadata.privacy_status.toUpperCase()}
                                        </p>
                                    </div>
                                    <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                                        <button onclick="editMetadata('${video.id}')" class="btn btn-secondary">✏️ Edit</button>
                                    </div>
                                </div>
                                <div style="margin-top: 1rem; display: none;" id="metadata-edit-${video.id}">
                                    <form onsubmit="saveMetadata(event, '${video.id}')">
                                        <div style="margin-bottom: 1rem;">
                                            <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Title:</label>
                                            <input type="text" class="form-input" id="title-input-${video.id}" value="${video.youtube_metadata.title}" maxlength="100" required>
                                            <small style="color: var(--text-secondary);">Max 100 characters</small>
                                        </div>
                                        <div style="margin-bottom: 1rem;">
                                            <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Description:</label>
                                            <textarea class="form-input" id="description-input-${video.id}" rows="8" required>${video.youtube_metadata.description}</textarea>
                                        </div>
                                        <div style="margin-bottom: 1rem;">
                                            <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Tags (comma-separated):</label>
                                            <textarea class="form-input" id="tags-input-${video.id}" rows="3" placeholder="tag1, tag2, tag3...">${video.youtube_metadata.tags.join(', ')}</textarea>
                                            <small style="color: var(--text-secondary);">Separate tags with commas</small>
                                        </div>
                                        <div style="margin-bottom: 1rem;">
                                            <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Privacy:</label>
                                            <select class="form-select" id="privacy-input-${video.id}">
                                                <option value="public" ${video.youtube_metadata.privacy_status === 'public' ? 'selected' : ''}>Public</option>
                                                <option value="unlisted" ${video.youtube_metadata.privacy_status === 'unlisted' ? 'selected' : ''}>Unlisted</option>
                                                <option value="private" ${video.youtube_metadata.privacy_status === 'private' ? 'selected' : ''}>Private</option>
                                            </select>
                                        </div>
                                        <div style="display: flex; gap: 0.5rem;">
                                            <button type="submit" class="btn btn-primary">💾 Save</button>
                                            <button type="button" onclick="cancelEditMetadata('${video.id}')" class="btn btn-secondary">❌ Cancel</button>
                                        </div>
                                    </form>
                                </div>
                            </details>
                        ` : ''}

                        <!-- Video Editor -->
                        ${video.segments && video.segments.length > 0 && (video.status === 'completed' || video.status === 'uploaded') ? `
                            <details style="margin-top: 1.5rem; padding: 1rem; background: #f8fafc; border-radius: 6px;" id="editor-${video.id}">
                                <summary style="cursor: pointer; font-weight: 600; color: var(--primary-color);">
                                    ✂️ Edit Video
                                </summary>
                                <div style="margin-top: 1rem;">
                                    <p style="margin-bottom: 1rem; color: var(--text-secondary);">
                                        Reorder segments, remove segments, or toggle intro/outro. Video will be regenerated.
                                    </p>

                                    <!-- Intro/Outro Toggle -->
                                    <div style="margin-bottom: 1.5rem; padding: 1rem; background: white; border-radius: 6px;">
                                        <h4 style="margin-bottom: 0.5rem;">Intro/Outro Options</h4>
                                        <div style="display: flex; gap: 2rem;">
                                            <label style="display: flex; align-items: center; cursor: pointer;">
                                                <input type="checkbox" id="show-intro-${video.id}" checked style="margin-right: 0.5rem;">
                                                Include Intro
                                            </label>
                                            <label style="display: flex; align-items: center; cursor: pointer;">
                                                <input type="checkbox" id="show-outro-${video.id}" checked style="margin-right: 0.5rem;">
                                                Include Outro
                                            </label>
                                        </div>
                                    </div>

                                    <!-- Segments List -->
                                    <div style="margin-bottom: 1.5rem;">
                                        <h4 style="margin-bottom: 0.5rem;">Segments (Drag to reorder)</h4>
                                        <ul id="segments-list-${video.id}" style="list-style: none; padding: 0;">
                                            ${video.segments.map((seg, idx) => `
                                                <li
                                                    data-segment-id="${seg.segment_id || idx}"
                                                    draggable="true"
                                                    style="
                                                        padding: 0.75rem;
                                                        margin-bottom: 0.5rem;
                                                        background: white;
                                                        border: 1px solid #e5e7eb;
                                                        border-radius: 6px;
                                                        cursor: move;
                                                        display: flex;
                                                        justify-content: space-between;
                                                        align-items: center;
                                                    "
                                                    ondragstart="handleDragStart(event)"
                                                    ondragover="handleDragOver(event)"
                                                    ondrop="handleDrop(event)"
                                                    ondragend="handleDragEnd(event)"
                                                >
                                                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                                                        <span style="color: var(--text-secondary);">☰</span>
                                                        <strong>${idx + 1}.</strong>
                                                        <span>${seg.title}</span>
                                                        <small style="color: var(--text-secondary);">(${utils.formatDuration(seg.duration)})</small>
                                                    </div>
                                                    <button
                                                        onclick="removeSegment(event, '${video.id}', '${seg.segment_id || idx}')"
                                                        class="btn btn-danger"
                                                        style="padding: 0.25rem 0.5rem; font-size: 0.85rem;"
                                                    >
                                                        ✕ Remove
                                                    </button>
                                                </li>
                                            `).join('')}
                                        </ul>
                                    </div>

                                    <div style="display: flex; gap: 0.5rem;">
                                        <button onclick="saveVideoEdit('${video.id}')" class="btn btn-primary">🔄 Regenerate Video</button>
                                        <button onclick="cancelVideoEdit('${video.id}')" class="btn btn-secondary">❌ Cancel</button>
                                    </div>
                                </div>
                            </details>
                        ` : ''}

                        <!-- Actions -->
                        <div style="margin-top: 1rem; display: flex; gap: 1rem; justify-content: flex-end; flex-wrap: wrap;">
                            ${video.youtube_metadata ? `<button onclick="copyMetadata('${video.id}')" class="btn btn-secondary">📋 Copy Metadata</button>` : ''}
                            ${video.video_path && !video.youtube_url ? `<button onclick="uploadToYouTube('${video.id}')" class="btn btn-success">📤 Upload to YouTube</button>` : ''}
                            ${video.youtube_url ? `<a href="${video.youtube_url}" target="_blank" class="btn btn-primary">🎬 View on YouTube</a>` : ''}
                            ${video.video_path ? `<button onclick="downloadVideo('${video.video_path}')" class="btn btn-secondary">📥 Download</button>` : ''}
                            <button onclick="deleteVideo('${video.id}')" class="btn btn-danger">🗑️ Delete</button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        document.getElementById('videos-list').innerHTML = videosHtml;

        // Restore open details state
        if (preserveState && openDetails.size > 0) {
            setTimeout(() => {
                openDetails.forEach(detailsId => {
                    const detail = document.getElementById(detailsId);
                    if (detail) {
                        detail.open = true;
                    }
                });
            }, 100);
        }

        // Smart conditional auto-refresh: only refresh if videos are in progress
        if (shouldAutoRefresh(videos)) {
            startAutoRefresh();
        } else {
            stopAutoRefresh();
        }

    } catch (error) {
        console.error('Error loading videos:', error);
        stopAutoRefresh(); // Stop refresh on error
        document.getElementById('videos-list').innerHTML = `
            <div class="card">
                <div class="card-body" style="text-align: center; padding: 2rem; color: var(--danger-color);">
                    <p>Error loading videos: ${error.message}</p>
                </div>
            </div>
        `;
        utils.showToast('Error loading videos', 'error');
    }
}

function downloadVideo(videoPath) {
    // In a real implementation, this would trigger a download
    utils.showToast('Video path: ' + videoPath, 'info');
}

async function deleteVideo(videoId) {
    if (!confirm(`Are you sure you want to delete video ${videoId}?`)) {
        return;
    }

    try {
        await API.Videos.deleteVideo(videoId);
        utils.showToast('Video deleted successfully', 'success');
        loadVideos();
    } catch (error) {
        console.error('Error deleting video:', error);
        utils.showToast('Error deleting video: ' + error.message, 'error');
    }
}

async function copyMetadata(videoId) {
    try {
        const video = await API.Videos.getVideo(videoId);
        if (!video.youtube_metadata) {
            utils.showToast('No metadata available', 'error');
            return;
        }

        const metadata = video.youtube_metadata;
        const text = `Title:\n${metadata.title}\n\nDescription:\n${metadata.description}\n\nTags:\n${metadata.tags.join(', ')}`;

        await navigator.clipboard.writeText(text);
        utils.showToast('Metadata copied to clipboard!', 'success');
    } catch (error) {
        console.error('Error copying metadata:', error);
        utils.showToast('Error copying metadata: ' + error.message, 'error');
    }
}

function editMetadata(videoId) {
    // Hide display, show edit form
    document.getElementById(`metadata-display-${videoId}`).style.display = 'none';
    document.getElementById(`metadata-edit-${videoId}`).style.display = 'block';
}

function cancelEditMetadata(videoId) {
    // Show display, hide edit form
    document.getElementById(`metadata-display-${videoId}`).style.display = 'block';
    document.getElementById(`metadata-edit-${videoId}`).style.display = 'none';
}

async function saveMetadata(event, videoId) {
    event.preventDefault();

    try {
        const title = document.getElementById(`title-input-${videoId}`).value;
        const description = document.getElementById(`description-input-${videoId}`).value;
        const tagsInput = document.getElementById(`tags-input-${videoId}`).value;
        const privacyStatus = document.getElementById(`privacy-input-${videoId}`).value;

        // Parse tags (comma-separated)
        const tags = tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag.length > 0);

        // Validate
        if (title.length > 100) {
            utils.showToast('Title must be 100 characters or less', 'error');
            return;
        }

        // Update via API
        const response = await fetch(`/api/videos/${videoId}/metadata`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                title,
                description,
                tags,
                privacy_status: privacyStatus,
            }),
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();

        // Update UI
        document.getElementById(`title-display-${videoId}`).textContent = title;
        document.getElementById(`description-display-${videoId}`).textContent = description;

        // Update tags display
        const tagsDisplay = document.getElementById(`tags-display-${videoId}`);
        const tagsHtml = tags.slice(0, 20).map(tag =>
            `<span style="padding: 0.25rem 0.5rem; background: var(--primary-color); color: white; border-radius: 4px; font-size: 0.85rem;">${tag}</span>`
        ).join('');
        const moreTagsHtml = tags.length > 20 ?
            `<span style="padding: 0.25rem 0.5rem; background: #6b7280; color: white; border-radius: 4px; font-size: 0.85rem;">+${tags.length - 20} more</span>` : '';
        tagsDisplay.innerHTML = tagsHtml + moreTagsHtml;

        // Cancel edit mode
        cancelEditMetadata(videoId);

        utils.showToast('Metadata updated successfully!', 'success');
    } catch (error) {
        console.error('Error saving metadata:', error);
        utils.showToast('Error saving metadata: ' + error.message, 'error');
    }
}

// ==================
// Video Editor Functions
// ==================

let draggedElement = null;

function handleDragStart(event) {
    draggedElement = event.target;
    event.target.style.opacity = '0.5';
}

function handleDragOver(event) {
    event.preventDefault();
    return false;
}

function handleDrop(event) {
    event.stopPropagation();
    event.preventDefault();

    if (draggedElement !== event.target && event.target.tagName === 'LI') {
        const list = event.target.parentNode;
        const draggedIndex = Array.from(list.children).indexOf(draggedElement);
        const targetIndex = Array.from(list.children).indexOf(event.target);

        if (draggedIndex < targetIndex) {
            event.target.parentNode.insertBefore(draggedElement, event.target.nextSibling);
        } else {
            event.target.parentNode.insertBefore(draggedElement, event.target);
        }
    }

    return false;
}

function handleDragEnd(event) {
    event.target.style.opacity = '';
    draggedElement = null;
}

function removeSegment(event, videoId, segmentId) {
    event.stopPropagation();

    if (!confirm('Remove this segment from the video?')) {
        return;
    }

    const list = document.getElementById(`segments-list-${videoId}`);
    const items = Array.from(list.children);

    items.forEach(item => {
        if (item.dataset.segmentId === segmentId) {
            item.remove();
        }
    });

    // Re-number segments
    const remainingItems = Array.from(list.children);
    remainingItems.forEach((item, idx) => {
        const numberSpan = item.querySelector('strong');
        if (numberSpan) {
            numberSpan.textContent = `${idx + 1}.`;
        }
    });

    utils.showToast('Segment removed. Click "Regenerate Video" to apply changes.', 'info');
}

async function saveVideoEdit(videoId) {
    if (!confirm('Regenerate video with these changes? This may take a few minutes.')) {
        return;
    }

    try {
        // Get segment order
        const list = document.getElementById(`segments-list-${videoId}`);
        const segmentIds = Array.from(list.children).map(item => item.dataset.segmentId);

        // Get intro/outro settings
        const showIntro = document.getElementById(`show-intro-${videoId}`).checked;
        const showOutro = document.getElementById(`show-outro-${videoId}`).checked;

        // Send edit request
        const response = await fetch(`/api/videos/${videoId}/edit`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                segment_ids: segmentIds,
                show_intro: showIntro,
                show_outro: showOutro,
            }),
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();

        utils.showToast('Video regeneration started! This may take a few minutes.', 'success');

        // Reload videos after a delay
        setTimeout(() => {
            loadVideos();
        }, 2000);

    } catch (error) {
        console.error('Error saving video edit:', error);
        utils.showToast('Error saving edits: ' + error.message, 'error');
    }
}

function cancelVideoEdit(videoId) {
    if (confirm('Cancel all changes and reload?')) {
        loadVideos();
    }
}

async function uploadToYouTube(videoId) {
    if (!confirm('Upload this video to YouTube?\n\nThis will:\n- Upload the video file\n- Upload the thumbnail\n- Use the generated metadata (title, description, tags)\n\nContinue?')) {
        return;
    }

    try {
        utils.showToast('Uploading to YouTube...', 'info');

        const response = await fetch(`/api/videos/${videoId}/upload-youtube`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || `HTTP ${response.status}`);
        }

        const result = await response.json();

        utils.showToast('Successfully uploaded to YouTube!', 'success');

        // Reload videos to show YouTube URL
        setTimeout(() => {
            loadVideos();
        }, 1000);

    } catch (error) {
        console.error('YouTube upload failed:', error);
        utils.showToast(`Upload failed: ${error.message}`, 'error');
    }
}

async function generateThumbnail(videoId) {
    try {
        utils.showToast('Generating thumbnail...', 'info');

        const response = await fetch(`/api/videos/${videoId}/generate-thumbnail`, {
            method: 'POST',
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || `HTTP ${response.status}`);
        }

        const result = await response.json();

        utils.showToast('Thumbnail generated successfully!', 'success');

        // Reload videos to show thumbnail
        setTimeout(() => {
            loadVideos(true); // preserve state
        }, 500);

    } catch (error) {
        console.error('Thumbnail generation failed:', error);
        utils.showToast(`Failed to generate thumbnail: ${error.message}`, 'error');
    }
}

// Smart conditional auto-refresh
let autoRefreshInterval = null;

function shouldAutoRefresh(videos) {
    // Check if any video is in progress
    const inProgressStatuses = ['pending', 'generating', 'uploading'];
    return videos.some(video => inProgressStatuses.includes(video.status));
}

function startAutoRefresh() {
    if (autoRefreshInterval) {
        return; // Already running
    }

    console.log('Starting auto-refresh (video generation in progress)');
    autoRefreshInterval = setInterval(() => {
        loadVideos(true); // preserveState = true
    }, 10000); // 10 seconds
}

function stopAutoRefresh() {
    if (autoRefreshInterval) {
        console.log('Stopping auto-refresh (all videos completed)');
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
    }
}

// Load on page load
document.addEventListener('DOMContentLoaded', loadVideos);
</script>
