{% extends "base.html" %}

{% block title %}News - Tech News Digest{% endblock %}

{% block content %}
<h1 style="margin-bottom: 2rem;">📰 Tech News</h1>

<!-- Controls -->
<div class="card" style="margin-bottom: 2rem;">
    <div class="card-body">
        <div style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                <label class="form-label">Sources</label>
                <select id="sources" class="form-select">
                    <option value="techcrunch,theverge">TechCrunch + The Verge</option>
                    <option value="techcrunch">TechCrunch</option>
                    <option value="theverge">The Verge</option>
                </select>
            </div>
            <div class="form-group" style="flex: 1; min-width: 150px; margin-bottom: 0;">
                <label class="form-label">Max Age (hours)</label>
                <input type="number" id="max-age" class="form-input" value="24" min="1" max="168">
            </div>
            <div class="form-group" style="flex: 1; min-width: 150px; margin-bottom: 0;">
                <label class="form-label">Limit</label>
                <input type="number" id="limit" class="form-input" value="10" min="1" max="50">
            </div>
            <button onclick="loadNews()" class="btn btn-primary">🔄 Refresh</button>
            <button onclick="showManualNewsForm()" class="btn btn-success">➕ Add Manual News</button>
        </div>
    </div>
</div>

<!-- Manual News Form Modal -->
<div id="manual-news-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto;">
    <div style="max-width: 800px; margin: 2rem auto; padding: 2rem;">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">➕ Add Manual News</h2>
                <button onclick="closeManualNewsForm()" class="btn btn-secondary">✕</button>
            </div>
            <div class="card-body">
                <form id="manual-news-form" onsubmit="submitManualNews(event)">
                    <div class="form-group">
                        <label class="form-label">Title *</label>
                        <input type="text" id="manual-title" class="form-input" required minlength="5" maxlength="200"
                               placeholder="e.g., OpenAI Releases Revolutionary GPT-5 Model">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Summary * (20-1000 characters)</label>
                        <textarea id="manual-summary" class="form-input" required minlength="20" maxlength="1000" rows="4"
                                  placeholder="Brief summary of the news article (minimum 20 characters)..."></textarea>
                        <small style="color: var(--text-secondary);">Character count: <span id="summary-count">0</span>/1000</small>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Full Content (optional, max 5000 characters)</label>
                        <textarea id="manual-content" class="form-input" maxlength="5000" rows="6"
                                  placeholder="Full article content (optional)..."></textarea>
                        <small style="color: var(--text-secondary);">Character count: <span id="content-count">0</span>/5000</small>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Image URL (optional)</label>
                        <input type="url" id="manual-image-url" class="form-input"
                               placeholder="https://example.com/image.jpg">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select id="manual-category" class="form-select">
                            <option value="ai_ml">AI/ML</option>
                            <option value="software_cloud">Software/Cloud</option>
                            <option value="startup_funding">Startup/Funding</option>
                            <option value="security">Security</option>
                            <option value="hardware">Hardware</option>
                            <option value="mobile">Mobile</option>
                            <option value="tech_general">Tech General</option>
                            <option value="business">Business</option>
                        </select>
                    </div>

                    <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                        <button type="button" onclick="closeManualNewsForm()" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-success">✓ Create News</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Selected News Actions -->
<div id="selected-actions" style="display: none; margin-bottom: 2rem;">
    <div class="card" style="background: #dbeafe; border: 2px solid var(--primary-color);">
        <div class="card-body">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <strong><span id="selected-count">0</span> articles selected</strong>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button onclick="clearSelection()" class="btn btn-secondary">Clear Selection</button>
                    <button onclick="createVideo()" class="btn btn-success">🎬 Create Video</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- News List -->
<div class="card">
    <div class="card-header">
        <h2 class="card-title">News Articles</h2>
        <span id="news-count" style="color: var(--text-secondary);">0 articles</span>
    </div>
    <div class="card-body">
        <div id="news-list">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading news...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let selectedNews = new Set();
let allNews = [];

async function loadNews() {
    try {
        const sources = document.getElementById('sources').value;
        const maxAge = parseInt(document.getElementById('max-age').value);
        const limit = parseInt(document.getElementById('limit').value);

        document.getElementById('news-list').innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <p>Fetching news...</p>
            </div>
        `;

        const data = await API.News.getNews({ sources, max_age_hours: maxAge, limit, translate: true });
        allNews = data.news;

        document.getElementById('news-count').textContent = `${data.total} articles`;

        if (data.news.length === 0) {
            document.getElementById('news-list').innerHTML = `
                <p style="text-align: center; color: var(--text-secondary); padding: 2rem;">
                    No news articles found
                </p>
            `;
            return;
        }

        const newsHtml = data.news.map(news => `
            <div class="news-item ${selectedNews.has(news.id) ? 'selected' : ''}"
                 onclick="toggleNews('${news.id}')"
                 id="news-${news.id}">
                ${news.image_url
                    ? `<img src="${news.image_url}" alt="${news.title}" class="news-thumbnail" onerror="this.style.display='none'">`
                    : '<div class="news-thumbnail" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem;">📰</div>'
                }
                <div class="news-content">
                    <div class="news-title">${news.title_en || news.title}</div>
                    <div class="news-meta">
                        <span class="badge badge-info">${news.category}</span>
                        <span>${news.source}</span>
                        <span>Score: ${news.score.toFixed(1)}</span>
                        <span>${utils.formatDate(news.published_at)}</span>
                    </div>
                    <div class="news-summary">${news.summary_en || news.summary}</div>
                </div>
            </div>
        `).join('');

        document.getElementById('news-list').innerHTML = newsHtml;
        updateSelectedUI();

        utils.showToast(`Loaded ${data.total} news articles`, 'success');
    } catch (error) {
        console.error('Error loading news:', error);
        document.getElementById('news-list').innerHTML = `
            <p style="text-align: center; color: var(--danger-color); padding: 2rem;">
                Error loading news: ${error.message}
            </p>
        `;
        utils.showToast('Error loading news', 'error');
    }
}

function toggleNews(newsId) {
    if (selectedNews.has(newsId)) {
        selectedNews.delete(newsId);
        document.getElementById(`news-${newsId}`).classList.remove('selected');
    } else {
        if (selectedNews.size >= 5) {
            utils.showToast('Maximum 5 articles can be selected', 'error');
            return;
        }
        selectedNews.add(newsId);
        document.getElementById(`news-${newsId}`).classList.add('selected');
    }
    updateSelectedUI();
}

function clearSelection() {
    selectedNews.clear();
    document.querySelectorAll('.news-item').forEach(item => {
        item.classList.remove('selected');
    });
    updateSelectedUI();
}

function updateSelectedUI() {
    const count = selectedNews.size;
    document.getElementById('selected-count').textContent = count;
    document.getElementById('selected-actions').style.display = count > 0 ? 'block' : 'none';
}

async function createVideo() {
    if (selectedNews.size === 0) {
        utils.showToast('Please select at least one news article', 'error');
        return;
    }

    const newsIds = Array.from(selectedNews);
    const uploadToYoutube = confirm('Upload to YouTube when ready?');

    try {
        const result = await API.Videos.createVideo(newsIds, uploadToYoutube);
        utils.showToast(`Video creation started: ${result.id}`, 'success');

        // Redirect to videos page after 2 seconds
        setTimeout(() => {
            window.location.href = '/videos';
        }, 2000);
    } catch (error) {
        console.error('Error creating video:', error);
        utils.showToast('Error creating video: ' + error.message, 'error');
    }
}

// Manual News Functions
function showManualNewsForm() {
    document.getElementById('manual-news-modal').style.display = 'block';
    document.getElementById('manual-title').focus();
}

function closeManualNewsForm() {
    document.getElementById('manual-news-modal').style.display = 'none';
    document.getElementById('manual-news-form').reset();
    document.getElementById('summary-count').textContent = '0';
    document.getElementById('content-count').textContent = '0';
}

async function submitManualNews(event) {
    event.preventDefault();

    const title = document.getElementById('manual-title').value.trim();
    const summary = document.getElementById('manual-summary').value.trim();
    const content = document.getElementById('manual-content').value.trim();
    const imageUrl = document.getElementById('manual-image-url').value.trim();
    const category = document.getElementById('manual-category').value;

    if (!title || !summary) {
        utils.showToast('Title and Summary are required', 'error');
        return;
    }

    if (summary.length < 20) {
        utils.showToast('Summary must be at least 20 characters', 'error');
        return;
    }

    try {
        const response = await fetch('/api/news/manual', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                title,
                summary,
                content: content || null,
                image_url: imageUrl || null,
                category
            })
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Failed to create manual news');
        }

        const news = await response.json();
        utils.showToast(`✓ Manual news created: ${news.title.substring(0, 40)}...`, 'success');

        // Close modal
        closeManualNewsForm();

        // Add new news to the top of the list (instead of full reload)
        allNews.unshift(news);

        // Create news item HTML
        const newsHtml = `
            <div class="news-item selected"
                 onclick="toggleNews('${news.id}')"
                 id="news-${news.id}">
                ${news.image_url
                    ? `<img src="${news.image_url}" alt="${news.title}" class="news-thumbnail" onerror="this.style.display='none'">`
                    : '<div class="news-thumbnail" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem;">📰</div>'
                }
                <div class="news-content">
                    <div class="news-title">${news.title}</div>
                    <div class="news-meta">
                        <span class="badge badge-info">${news.category}</span>
                        <span>${news.source}</span>
                        <span>Score: ${news.score.toFixed(1)}</span>
                        <span>${utils.formatDate(news.published_at)}</span>
                    </div>
                    <div class="news-summary">${news.summary}</div>
                </div>
            </div>
        `;

        // Prepend to news list
        const newsList = document.getElementById('news-list');
        newsList.insertAdjacentHTML('afterbegin', newsHtml);

        // Auto-select the new news
        selectedNews.add(news.id);
        updateSelectedUI();

        // Update count
        const currentCount = parseInt(document.getElementById('news-count').textContent);
        document.getElementById('news-count').textContent = `${currentCount + 1} articles`;

    } catch (error) {
        console.error('Error creating manual news:', error);
        utils.showToast('Error: ' + error.message, 'error');
    }
}

// Character counters
document.addEventListener('DOMContentLoaded', () => {
    const summaryTextarea = document.getElementById('manual-summary');
    const contentTextarea = document.getElementById('manual-content');
    const summaryCount = document.getElementById('summary-count');
    const contentCount = document.getElementById('content-count');

    if (summaryTextarea) {
        summaryTextarea.addEventListener('input', () => {
            summaryCount.textContent = summaryTextarea.value.length;
        });
    }

    if (contentTextarea) {
        contentTextarea.addEventListener('input', () => {
            contentCount.textContent = contentTextarea.value.length;
        });
    }

    // Load news on page load
    loadNews();
});
</script>
{% endblock %}
